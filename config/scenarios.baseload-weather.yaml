    start: '2010-01-01'
    end: '2011-01-01'
  atlite:
    default_cutout: &cutout2010 europe-2010-sarah3-era5
  renewable:
    onwind: {cutout: *cutout2010}
    offwind-ac: {cutout: *cutout2010}
    offwind-dc: {cutout: *cutout2010}
    offwind-float: {cutout: *cutout2010}
